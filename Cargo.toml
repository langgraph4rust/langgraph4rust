[package]
name = "langgraph4rust"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
authors = ["langgraph4rust <429608827@qq.com>"]
license = "Apache-2.0"
description = "A powerful Rust implementation of a stateful workflow engine inspired by Python's LangGraph"
repository = "https://github.com/langGraph4rust/langgraph4rust"
keywords = ["workflow", "graph", "state-machine", "async", "langgraph"]
categories = ["asynchronous", "data-structures", "development-tools"]
readme = "README.md"
documentation = "https://docs.rs/langgraph4rust"
homepage = "https://github.com/langGraph4rust/langgraph4rust#readme"
exclude = [
    ".gitignore",
    ".github/",
    ".idea/",
    "target/",
]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.91"
futures = "0.3.30"
tokio-stream = { version = "0.1.17", features = ["sync"] }

[dev-dependencies]
chrono = { version = "0.4.40", features = ["serde"] }

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "conditional_routing"
path = "examples/conditional_routing.rs"

[[example]]
name = "parallel_execution"
path = "examples/parallel_execution.rs"